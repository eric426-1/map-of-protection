        let currentData = [...protectedAreasData];
        let map;
        let markersLayer;
        let isYouBikeMode = false;

        // Initialize Map on Window Load
        window.onload = function() {
            initMap();
            renderStats();
            renderAreasList();
            setupEventListeners();
        };

        function initMap() {
            // Initial center set to Taiwan center: [23.9738, 120.9820], zoom level 7
            map = L.map('map').setView([23.9738, 120.9820], 7);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);
            plotMarkers(currentData);
        }

        function plotMarkers(data) {
            markersLayer.clearLayers();

            data.forEach(item => {
                let colorClass = '#059669'; // Emerald
                if (item.category === '野生動物保護區') colorClass = '#0d9488'; // Teal
                if (item.category === '自然保留區') colorClass = '#0284c7'; // Sky

                if (isYouBikeMode) {
                    colorClass = '#ea580c'; // Orange for YouBike
                }

                // Custom Leaflet DivIcon
                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div style="background-color: ${colorClass}; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); border: 2px solid white;">
                        <i class="fa-solid ${isYouBikeMode ? 'fa-bicycle' : 'fa-tree'} text-xs"></i>
                    </div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                const marker = L.marker([item.lat, item.lng], { icon: customIcon });

                let popupContent = '';
                if (!isYouBikeMode) {
                    popupContent = `
                        <div class="p-1 max-w-xs">
                            <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">${item.category}</span>
                            <h4 class="font-black text-slate-900 text-base mt-1.5">${item.name}</h4>
                            <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-location-dot mr-1 text-emerald-600"></i>${item.location}</p>
                            <div class="mt-2 text-xs text-slate-700 space-y-1 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                <div><span class="text-slate-400">陸域面積：</span><b>${item.landArea.toLocaleString()} 公頃</b></div>
                                <div><span class="text-slate-400">海域面積：</span><b>${item.seaArea.toLocaleString()} 公頃</b></div>
                                <div><span class="text-slate-400">管理機關：</span>${item.agency}</div>
                            </div>
                            <p class="text-xs text-slate-600 mt-2 line-clamp-2">${item.desc}</p>
                        </div>
                    `;
                } else {
                    popupContent = `
                        <div class="p-1 max-w-xs">
                            <span class="text-[10px] bg-orange-100 text-orange-800 px-2 py-0.5 rounded-full font-bold">YouBike 2.0 即時站點</span>
                            <h4 class="font-black text-slate-900 text-base mt-1.5">${item.name}</h4>
                            <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-location-dot mr-1 text-orange-600"></i>${item.location}</p>
                            <div class="mt-2 grid grid-cols-2 gap-2 text-center text-xs">
                                <div class="bg-orange-50 p-2 rounded-xl border border-orange-100">
                                    <span class="text-slate-400 block text-[10px]">可借車輛</span>
                                    <span class="font-black text-orange-600 text-sm">${item.availableBikes} 輛</span>
                                </div>
                                <div class="bg-emerald-50 p-2 rounded-xl border border-emerald-100">
                                    <span class="text-slate-400 block text-[10px]">可還車位</span>
                                    <span class="font-black text-emerald-600 text-sm">${item.emptySpaces} 個</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                marker.bindPopup(popupContent);
                markersLayer.addLayer(marker);
            });
        }

        function renderAreasList() {
            const container = document.getElementById('areasListContainer');
            container.innerHTML = '';
            document.getElementById('listCount').textContent = currentData.length;

            if (currentData.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs">找不到符合條件的項目</div>`;
                return;
            }

            currentData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'p-3.5 rounded-2xl bg-slate-50 hover:bg-emerald-50/60 border border-slate-100 hover:border-emerald-200 transition cursor-pointer flex flex-col gap-1.5 group';
                
                if (!isYouBikeMode) {
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <h4 class="font-bold text-slate-800 text-sm group-hover:text-emerald-700 transition">${item.name}</h4>
                            <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium">${item.category}</span>
                        </div>
                        <p class="text-xs text-slate-500 truncate"><i class="fa-solid fa-location-dot mr-1 text-emerald-600"></i>${item.location}</p>
                        <div class="flex justify-between text-[11px] text-slate-600 font-medium mt-1">
                            <span>陸域：${item.landArea.toLocaleString()} 公頃</span>
                            <span class="text-emerald-600 font-bold group-hover:underline">點擊定位 <i class="fa-solid fa-arrow-right ml-0.5"></i></span>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <h4 class="font-bold text-slate-800 text-sm group-hover:text-orange-700 transition">${item.name}</h4>
                            <span class="text-[10px] bg-orange-100 text-orange-800 px-2 py-0.5 rounded-full font-bold">YouBike 2.0</span>
                        </div>
                        <p class="text-xs text-slate-500 truncate"><i class="fa-solid fa-location-dot mr-1 text-orange-600"></i>${item.location}</p>
                        <div class="flex justify-between text-xs font-bold mt-1">
                            <span class="text-orange-600">可借: ${item.availableBikes} | 可還: ${item.emptySpaces}</span>
                            <span class="text-orange-700 underline">定位 <i class="fa-solid fa-arrow-right ml-0.5"></i></span>
                        </div>
                    `;
                }

                card.addEventListener('click', () => {
                    map.setView([item.lat, item.lng], 13, { animate: true });
                });

                container.appendChild(card);
            });
        }

        function renderStats() {
            if (!isYouBikeMode) {
                document.getElementById('statTitle1').textContent = "保護區總數";
                document.getElementById('statTitle2').textContent = "陸域總面積";
                document.getElementById('statTitle3').textContent = "海域總面積";

                document.getElementById('totalCount').textContent = protectedAreasData.length;
                const totalLand = protectedAreasData.reduce((sum, i) => sum + i.landArea, 0);
                const totalSea = protectedAreasData.reduce((sum, i) => sum + i.seaArea, 0);
                document.getElementById('totalLandArea').textContent = totalLand.toLocaleString() + ' 公頃';
                document.getElementById('totalSeaArea').textContent = totalSea.toLocaleString() + ' 公頃';
            } else {
                document.getElementById('statTitle1').textContent = "站點總數";
                document.getElementById('statTitle2').textContent = "總可借車輛";
                document.getElementById('statTitle3').textContent = "總可還空位";

                document.getElementById('totalCount').textContent = currentData.length;
                const totalBikes = currentData.reduce((sum, i) => sum + i.availableBikes, 0);
                const totalSpaces = currentData.reduce((sum, i) => sum + i.emptySpaces, 0);
                document.getElementById('totalLandArea').textContent = totalBikes.toLocaleString() + ' 輛';
                document.getElementById('totalSeaArea').textContent = totalSpaces.toLocaleString() + ' 個';
            }
            document.getElementById('filteredCount').textContent = currentData.length;
        }

        function setupEventListeners() {
            document.getElementById('searchInput').addEventListener('input', filterData);
            document.getElementById('categoryFilter').addEventListener('change', filterData);
            
            document.getElementById('regionJump').addEventListener('change', (e) => {
                const val = e.target.value;
                let coords = [23.9738, 120.9820];
                let zoom = 7;
                if (val === 'north') { coords = [25.05, 121.50]; zoom = 10; }
                else if (val === 'central') { coords = [24.15, 120.95]; zoom = 10; }
                else if (val === 'south') { coords = [22.62, 120.30]; zoom = 10; }
                else if (val === 'east') { coords = [23.98, 121.60]; zoom = 10; }
                else if (val === 'outlying') { coords = [23.56, 119.56]; zoom = 9; }
                map.setView(coords, zoom, { animate: true });
            });

            document.getElementById('toggleLayerBtn').addEventListener('click', toggleDataLayer);
        }

        function filterData() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const category = document.getElementById('categoryFilter').value;

            const dataSource = isYouBikeMode ? youBikeMockData : protectedAreasData;

            currentData = dataSource.filter(item => {
                const matchesName = item.name.toLowerCase().includes(query) || item.location.toLowerCase().includes(query);
                const matchesCat = isYouBikeMode || category === 'all' || item.category === category;
                return matchesName && matchesCat;
            });

            renderStats();
            renderAreasList();
            plotMarkers(currentData);
        }

        // Mock YouBike 2.0 Dataset for demonstration of API integration requirement
        const youBikeMockData = [
            { id: 101, name: "台北車站（3號出口）", category: "YouBike", lat: 25.0478, lng: 121.5170, location: "中正區", availableBikes: 18, emptySpaces: 12 },
            { id: 102, name: "捷運西門站（1號出口）", category: "YouBike", lat: 25.0420, lng: 121.5075, location: "萬華區", availableBikes: 8, emptySpaces: 24 },
            { id: 103, name: "國立台灣大學（圖書館前）", category: "YouBike", lat: 25.0173, lng: 121.5405, location: "大安區", availableBikes: 25, emptySpaces: 2 },
            { id: 104, name: "松山車站", category: "YouBike", lat: 25.0500, lng: 121.5775, location: "松山區", availableBikes: 12, emptySpaces: 15 },
            { id: 105, name: "高雄火車站", category: "YouBike", lat: 22.6395, lng: 120.3025, location: "三民區", availableBikes: 15, emptySpaces: 10 },
            { id: 106, name: "台中火車站", category: "YouBike", lat: 24.1368, lng: 120.6850, location: "中區", availableBikes: 20, emptySpaces: 8 }
        ];

        function toggleDataLayer() {
            isYouBikeMode = !isYouBikeMode;
            const badgeText = document.getElementById('layerBadgeText');
            const catFilter = document.getElementById('categoryFilter');

            if (isYouBikeMode) {
                badgeText.innerHTML = '<i class="fa-solid fa-tree text-emerald-600"></i> 切換保護區圖資';
                catFilter.disabled = true;
                catFilter.classList.add('opacity-50');
                currentData = [...youBikeMockData];
            } else {
                badgeText.innerHTML = '<i class="fa-solid fa-bicycle text-emerald-600"></i> 切換 YouBike 即時站點';
                catFilter.disabled = false;
                catFilter.classList.remove('opacity-50');
                currentData = [...protectedAreasData];
            }

            renderStats();
            renderAreasList();
            plotMarkers(currentData);
        }
    </script>
</body>
</html>
